# Runs on every push and pull request. Nothing here signs or publishes anything.
name: CI
on:
  push:
  pull_request:

# A new push cancels the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    # The app uses macOS 26 SDK APIs (Liquid Glass) behind #available, so it needs Xcode 26+.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen tmux
      - name: VoxCore tests (incl. grammar parity with Windows)
        run: cd Packages/VoxCore && swift test
      - name: App build (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project Vox.xcodeproj -scheme Vox -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build -quiet

  windows:
    # Real ConPTY: the agent tests start a pseudo-terminal and type into it.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: npm test (failures become annotations, readable without logging in)
        shell: pwsh
        run: |
          node --test --test-force-exit --test-timeout=120000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml (Get-ChildItem test/*.test.js).FullName
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path junit.xml)) {
            [xml]$x = Get-Content junit.xml
            foreach ($f in $x.SelectNodes("//testcase[failure]")) {
              $msg = ($f.failure.message + " " + $f.failure.InnerText) -replace "`r?`n", " | "
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($f.name)::$msg"
            }
          }
          exit $code

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Windows agent tests (grammar parity, HTTP, bash pseudo-terminals)
        run: cd windows && npm ci && npm test
      - name: Mac's embedded web app is up to date
        run: node scripts/embed-web.mjs --check
      - name: Landing page + demo build
        run: cd site && npm ci && npm run build
